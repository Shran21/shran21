name: profile-stats

# Regenerates the README's cards and lists from the GitHub API. The script is
# stdlib-only, so there is nothing to install and nothing to rate-limit but the
# API itself -- which the job's own GITHUB_TOKEN authenticates.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/profile_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards and lists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

          # A tile the API cannot know. Clear the value to drop the tile.
          STATIC_TILE_VALUE: "5+ years"
          STATIC_TILE_LABEL: "Experience"

          # Optional knobs -- uncomment to change what the cards count.
          #
          # FEATURED_REPOS: reBSGO,ns8-qbittorrent   # pin the project list, in order
          # FEATURED_COUNT: "6"                      # how many projects to show
          # MAX_LANGS: "6"                           # ceiling on coloured slots
          # MIN_LANG_SHARE: "0.5"                    # fold anything smaller into Other
          # EXCLUDE_REPOS: some-repo,another         # leave these out of every number
          # EXCLUDE_LANGS: HTML,CSS                  # ignore these languages
          # INCLUDE_ARCHIVED: "false"                # drop archived repositories
          # INCLUDE_FORKS: "true"                    # count forks as your code
        run: python scripts/profile_stats.py

      - name: Commit only when a number changed
        run: |
          git add assets README.md
          if git diff --cached --quiet; then
            echo "Stats are unchanged -- nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile stats"
          git push
